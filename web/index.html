<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blocks Builder</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%236cb6ff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="toolbar">
      <div class="brand">Blocks Builder</div>

      <nav class="menu-bar" aria-label="Application menu">
        <div class="menu-item">
          <button type="button" class="menu-trigger" aria-haspopup="true">File</button>
          <div class="menu-dropdown" role="menu">
            <button id="import-btn" type="button" role="menuitem" title="Import graph JSON">
              Import JSON…
            </button>
            <button id="export-btn" type="button" role="menuitem">Export JSON</button>
            <div class="menu-separator" role="separator"></div>
            <button id="codegen-btn" type="button" role="menuitem" class="menu-item-accent">
              Generate Python
            </button>
            <button id="codegen-test-btn" type="button" role="menuitem" title="Generate Python with a runnable __main__ test case">
              Generate Python (with test)
            </button>
            <button id="codegen-trace-btn" type="button" role="menuitem" title="Generate Python where forward() returns a _runtime_shapes dict">
              Generate Python (trace)
            </button>
            <div class="menu-separator" role="separator"></div>
            <button id="clear-btn" type="button" role="menuitem">Clear graph</button>
          </div>
        </div>

        <div class="menu-item">
          <button type="button" class="menu-trigger" aria-haspopup="true">Edit</button>
          <div class="menu-dropdown" role="menu">
            <button id="focus-input-btn" type="button" role="menuitem" title="Center on Input node">
              Focus Input
            </button>
            <div class="menu-separator" role="separator"></div>
            <button id="duplicate-btn" type="button" role="menuitem" title="Duplicate selected nodes (Ctrl/Cmd+D)">
              Duplicate <span class="menu-shortcut">⌘D</span>
            </button>
            <button id="delete-btn" type="button" role="menuitem" title="Delete selected nodes (Del / Backspace)">
              Delete <span class="menu-shortcut">Del</span>
            </button>
            <div class="menu-separator" role="separator"></div>
            <button id="group-btn" type="button" role="menuitem" title="Combine selected nodes into a subgraph (Ctrl/Cmd+G)">
              Group <span class="menu-shortcut">⌘G</span>
            </button>
            <button id="ungroup-btn" type="button" role="menuitem" title="Dissolve focused group (Ctrl/Cmd+Shift+G)">
              Ungroup <span class="menu-shortcut">⌘⇧G</span>
            </button>
          </div>
        </div>
      </nav>

      <label class="select">
        Framework
        <select id="framework-select">
          <option value="pytorch">pytorch_blocks</option>
          <option value="flax">flax_blocks</option>
        </select>
      </label>
      <input id="search" type="search" placeholder="Search blocks (Ctrl-K)" />
      <input id="import-file-input" type="file" accept=".json,application/json" hidden />
    </header>

    <main>
      <aside id="palette" aria-label="Block palette"></aside>
      <section id="editor"></section>
      <aside id="sidebar">
        <div id="diagnostics">
          <h3>Diagnostics</h3>
          <ul id="diag-list"><li class="ok">Graph is empty.</li></ul>
        </div>
        <div id="inspector">
          <h3>Inspector</h3>
          <div id="inspector-body"><p class="muted">Select a node to edit its parameters.</p></div>
        </div>
        <div id="runtime-panel">
          <h3>Runtime shapes</h3>
          <p class="muted runtime-hint">PyTorch only. Start the runner first:<br><code>python tools/shape_runner.py</code></p>
          <label class="row">
            Batch (B)
            <input id="batch-size" type="number" min="1" step="1" value="2" />
          </label>
          <button id="run-shapes-btn" disabled title="Resolve every axis to a number, then run a real forward pass">Run shape check</button>
          <p id="runtime-status" class="muted"></p>
        </div>
      </aside>
    </main>

    <dialog id="codegen-dialog">
      <header>
        <strong>Generated Python</strong>
        <span class="grow"></span>
        <button id="copy-code-btn">Copy</button>
        <button id="close-code-btn">Close</button>
      </header>
      <pre><code id="codegen-output"></code></pre>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
